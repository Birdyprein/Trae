<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暗房画廊 · Darkroom Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0E0E0F;--deep:#171718;--cream:#E8E2D6;--muted:#9B968C;--orange:#C46A3B;--red:#7A2E2A;
  
  /* iOS 27 Liquid Glass */
  --glass-bg: linear-gradient(135deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.04) 100%);
  --glass-border: rgba(255,255,255,.22);
  --glass-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 1px 1.5px rgba(255,255,255,.4);
  
  /* ColorOS 17 Fluid Mechanics */
  --fluid-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --fluid-damp: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease: var(--fluid-damp);

  --serif:"Cormorant Garamond","Noto Serif SC","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --hand:"LXGW WenKai","Kaiti SC","STKaiti",cursive;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--black);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
img{display:block;max-width:100%;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea,select{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(196,106,59,.4);}

body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(circle at 18% 14%,rgba(196,106,59,.20),transparent 42%),radial-gradient(circle at 86% 78%,rgba(122,46,42,.22),transparent 48%),radial-gradient(circle at 62% 42%,rgba(196,106,59,.06),transparent 60%);filter:blur(70px);animation:leak 30s ease-in-out infinite alternate;}
@keyframes leak{0%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(-4%,3%,0) scale(1.08);}100%{transform:translate3d(3%,-4%,0) scale(1.03);}}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.75'/></svg>");background-size:220px 220px;}

.glass{background:var(--glass-bg);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);isolation:isolate;transition:all 0.4s var(--fluid-spring);}
.glass-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;font-size:13px;letter-spacing:.06em;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .35s var(--ease),transform .35s var(--fluid-spring);cursor:pointer;}
.glass-btn:hover{background:rgba(255,255,255,.17);transform:translateY(-1px);}
.glass-btn:active{transform:scale(0.95) !important;transition:transform 0.1s var(--fluid-damp);}

.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(1280px,calc(100% - 32px));height:60px;z-index:60;display:flex;align-items:center;gap:20px;padding:0 20px;border-radius:18px;transition:height .45s var(--ease),background .45s var(--ease),padding .45s var(--ease);}
.nav.scrolled{height:48px;background:rgba(255,255,255,.13);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);}
.brand{font-family:var(--serif);font-size:17px;letter-spacing:.22em;font-weight:600;white-space:nowrap;flex:0 0 auto;cursor:pointer;}
.brand span{color:var(--orange);font-weight:400;letter-spacing:.1em;}
.nav-links{display:flex;gap:20px;margin:0 auto;}
.nav-links a{position:relative;font-size:13px;color:var(--muted);letter-spacing:.1em;padding:6px 0;transition:color .35s var(--ease);}
.nav-links a:hover{color:var(--cream);}
.nav-links a.active{color:var(--cream);}
.nav-links a.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--orange);}
.nav-right{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
.text-btn{height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;letter-spacing:.08em;color:var(--muted);transition:all .3s var(--ease);white-space:nowrap;}
.text-btn:hover{color:var(--cream);background:rgba(255,255,255,.1);}
.text-btn:active{transform:scale(0.95);transition:transform 0.1s var(--fluid-damp);}
.menu-toggle{display:none;}
.mobile-only{display:none;}

.search-pop{position:fixed;top:88px;left:50%;transform:translateX(-50%) translateY(-8px);width:min(560px,calc(100% - 32px));padding:14px 18px;border-radius:16px;z-index:59;opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--fluid-spring);}
.search-pop.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.search-pop input{width:100%;background:none;border:none;outline:none;color:var(--cream);font-size:15px;letter-spacing:.04em;}
.search-pop input::placeholder{color:var(--muted);}

#app{position:relative;z-index:2;padding-top:104px;min-height:100vh;}
.page{max-width:1280px;margin:0 auto;padding:0 24px 130px;}
.page-head{margin:36px 0 30px;}
.page-head h1{font-family:var(--serif);font-weight:300;font-size:clamp(30px,5vw,52px);letter-spacing:.03em;margin:0 0 8px;line-height:1.15;}
.page-desc{color:var(--muted);font-size:14px;letter-spacing:.08em;margin:0;}
.head-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;}

.hero{position:relative;min-height:64vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0 60px;}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(42px,9vw,110px);line-height:1.02;letter-spacing:.03em;margin:0 0 18px;background:linear-gradient(180deg,#F4EFE6 0%,#BFB8AA 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{color:var(--muted);font-size:15px;letter-spacing:.24em;margin:0;}
.scroll-hint{margin-top:56px;font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:rgba(155,150,140,.6);animation:breathe 4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.35;}50%{opacity:.85;}}
.today-film{position:absolute;right:0;bottom:40px;width:150px;border-radius:12px;padding:10px;transform:rotate(2.4deg);transition:transform .5s var(--fluid-spring);cursor:pointer;}
.today-film:hover{transform:rotate(0deg) translateY(-4px);}
.today-film img{width:100%;height:96px;object-fit:cover;border-radius:6px;filter:saturate(.85);}
.tf-label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--orange);margin-bottom:7px;}
.tf-title{display:block;font-size:11px;color:var(--muted);margin-top:7px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px;align-items:center;}
.chip{padding:8px 18px;border-radius:999px;font-size:12.5px;letter-spacing:.1em;color:var(--muted);border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);transition:all .35s var(--fluid-spring);white-space:nowrap;}
.chip:hover{color:var(--cream);border-color:rgba(255,255,255,.25);}
.chip.active{color:#1a1a1a;background:var(--cream);border-color:var(--cream);}
.chip:active{transform:scale(0.95);transition:transform 0.1s var(--fluid-damp);}
.filter-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

.masonry{position:relative;width:100%;}
.photo-card{position:absolute;top:0;left:0;border-radius:4px;overflow:hidden;background:#101011;cursor:pointer;animation:develop .78s var(--ease) backwards;animation-delay:calc(var(--i,0) * 55ms);transition:box-shadow .45s var(--ease);will-change:transform,opacity;}
@keyframes develop{from{opacity:0;transform:translateY(20px);filter:blur(9px);}to{opacity:1;transform:none;filter:blur(0);}}
.photo-card:hover{box-shadow:0 18px 50px rgba(0,0,0,.6);}
.card-media{position:absolute;inset:0;overflow:hidden;background:#151516;}
.card-media img{width:100%;height:100%;object-fit:cover;filter:saturate(.88) brightness(.94);transition:transform .7s var(--ease),filter .6s var(--ease);}
.photo-card:hover .card-media img{transform:scale(1.035);filter:saturate(1) brightness(1);}
.card-media::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.45) 100%);}
.photo-card.is-polaroid{background:#F2EDE3;padding:8px 8px 0;border-radius:3px;}
.photo-card.is-polaroid .card-media{position:relative;inset:auto;height:calc(100% - 34px);}
.photo-card.is-polaroid .card-media::after{display:none;}
.polaroid-caption{position:absolute;left:8px;right:8px;bottom:6px;height:28px;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:13px;color:#4a443c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.photo-card.is-film{background:#141415;padding:10px 10px 26px;border-radius:3px;}
.photo-card.is-film .card-media{position:relative;inset:auto;height:calc(100% - 14px);border-radius:2px;}
.photo-card.is-film .card-media::after{display:none;}
.photo-card.is-film .card-media img{filter:saturate(.92) brightness(.92);}
.film-holes-top,.film-holes-bottom{position:absolute;left:10px;right:10px;height:14px;pointer-events:none;z-index:2;background-image:radial-gradient(circle,rgba(232,226,214,.35) 0 3px,transparent 3.4px);background-size:18px 14px;background-position:9px center;transition:opacity .4s var(--ease);}
.film-holes-top{top:4px;}
.film-holes-bottom{bottom:4px;}
.photo-card.is-film:hover .film-holes-top,.photo-card.is-film:hover .film-holes-bottom{opacity:.85;}
.film-number{position:absolute;left:12px;bottom:8px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.55);letter-spacing:.14em;z-index:2;}
.card-fav{position:absolute;top:10px;left:10px;font-size:13px;color:var(--orange);text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none;z-index:3;}
.card-video-badge{position:absolute;top:10px;right:10px;z-index:3;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:3px 8px;border-radius:999px;letter-spacing:.08em;backdrop-filter:blur(6px);}
.card-tools{position:absolute;bottom:8px;right:8px;display:flex;gap:6px;z-index:4;opacity:0;transform:translateY(4px);transition:all .35s var(--fluid-spring);}
.photo-card:hover .card-tools{opacity:1;transform:none;}
.ct-btn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--cream);transition:all .3s var(--ease);}
.ct-btn:hover{background:rgba(255,255,255,.28);}
.ct-btn:active{transform:scale(0.9);}
.photo-card.is-polaroid .ct-btn{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.1);color:#4a443c;}
.photo-card.is-polaroid .ct-btn:hover{background:rgba(0,0,0,.18);}
.select-dot{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:rgba(0,0,0,.3);backdrop-filter:blur(10px);display:none;z-index:5;align-items:center;justify-content:center;font-size:12px;color:#111;}
body.select-mode .select-dot{display:flex;}
body.select-mode .card-tools,body.select-mode .card-fav,body.select-mode .card-video-badge,body.select-mode .film-holes-top,body.select-mode .film-holes-bottom,body.select-mode .film-number{display:none;}
.photo-card.selected .select-dot{background:var(--orange);border-color:var(--orange);}
.photo-card.selected .select-dot::after{content:"✓";color:#fff;font-size:12px;}
.photo-card.selected{outline:2px solid var(--orange);outline-offset:-2px;}

.section-block{margin:80px 0 0;}
.sec-title{font-family:var(--serif);font-weight:300;font-size:26px;letter-spacing:.06em;margin:0 0 22px;display:flex;align-items:center;gap:16px;}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.16),transparent);}

.filmstrip{position:relative;padding:0;overflow:hidden;border-radius:8px;background:#141415;}
.film-track{display:flex;gap:10px;overflow-x:auto;padding:24px 12px;scrollbar-width:none;cursor:grab;scroll-behavior:smooth;}
.film-track::-webkit-scrollbar{display:none;}
.film-track.dragging{cursor:grabbing;scroll-behavior:auto;}
.filmstrip::before,.filmstrip::after{content:"";position:absolute;left:0;right:0;height:16px;z-index:2;pointer-events:none;background-image:radial-gradient(circle,rgba(232,226,214,.3) 0 2.5px,transparent 3.2px);background-size:17px 16px;background-position:6px center;}
.filmstrip::before{top:4px;}.filmstrip::after{bottom:4px;}
.frame{flex:0 0 auto;width:150px;height:100px;border-radius:2px;overflow:hidden;position:relative;background:#222;transition:transform .45s var(--ease),opacity .45s var(--ease),filter .45s var(--ease);}
.frame img{width:100%;height:100%;object-fit:cover;filter:saturate(.82) brightness(.86);transition:filter .45s var(--ease);}
.frame-no{position:absolute;left:6px;bottom:5px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.75);letter-spacing:.14em;text-shadow:0 1px 4px rgba(0,0,0,.9);}
.film-track:hover .frame{opacity:.45;filter:brightness(.55);}
.film-track:hover .frame:hover{opacity:1;filter:none;transform:scale(1.07);}
.film-track:hover .frame:hover img{filter:saturate(1) brightness(1);}
.film-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--cream);font-size:20px;line-height:1;z-index:5;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s var(--ease),background .25s;user-select:none;}
.filmstrip:hover .film-arrow{opacity:1;}
.film-arrow:hover{background:rgba(255,255,255,.28);}
.film-arrow:active{transform:translateY(-50%) scale(.92);}
.film-arrow:disabled{opacity:.25;pointer-events:none;}
.film-arrow-left{left:8px;}
.film-arrow-right{right:8px;}
@media (max-width:860px){.film-arrow{display:none;}}

.polaroid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 20px;padding:10px 0;}
.polaroid-card{background:#F2EDE3;padding:10px 10px 0;border-radius:3px;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.5);transform:rotate(var(--rot,0deg));transition:transform .5s var(--fluid-spring),box-shadow .5s var(--ease);animation:develop .8s var(--ease) backwards;animation-delay:calc(var(--i,0) * 70ms);}
.polaroid-card:hover{transform:rotate(0deg) translateY(-6px) scale(1.02);box-shadow:0 24px 54px rgba(0,0,0,.62);}
.pc-media{aspect-ratio:1/1;overflow:hidden;background:#ddd;}
.pc-media img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) sepia(.05);}
.pc-title{font-family:var(--hand);font-size:14px;color:#4a443c;text-align:center;padding:12px 4px 4px;min-height:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pc-date{font-family:var(--mono);font-size:9px;color:#9a9184;text-align:center;letter-spacing:.12em;padding-bottom:10px;}
.story-note{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:13px;color:var(--muted);line-height:1.7;letter-spacing:.04em;}

.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
.album-card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;background:#131314;border:1px solid rgba(255,255,255,.07);transition:transform .5s var(--fluid-spring),box-shadow .5s var(--ease);}
.album-card:hover{transform:translateY(-4px);box-shadow:0 22px 54px rgba(0,0,0,.6);}
.album-cover{aspect-ratio:16/10;overflow:hidden;position:relative;}
.album-cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) brightness(.86);transition:transform .7s var(--ease),filter .6s var(--ease);}
.album-card:hover .album-cover img{transform:scale(1.05);filter:saturate(1) brightness(1);}
.album-cover.locked img{filter:blur(18px) brightness(.6) saturate(.4);}
.album-lock{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.35);}
.album-body{padding:16px 18px 20px;}
.album-name{font-family:var(--serif);font-size:20px;letter-spacing:.06em;margin:0 0 6px;}
.album-desc{color:var(--muted);font-size:12.5px;line-height:1.6;margin:0 0 10px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.album-meta{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:rgba(155,150,140,.75);}
.album-more{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;z-index:3;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transition:opacity .35s var(--ease);}
.album-card:hover .album-more{opacity:1;}

.empty{padding:80px 20px;text-align:center;color:var(--muted);font-size:14px;letter-spacing:.1em;line-height:2.2;}
.empty strong{display:block;font-family:var(--serif);font-size:24px;color:var(--cream);font-weight:300;margin-bottom:12px;}

.panel{border-radius:18px;padding:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted);margin-bottom:7px;}
.input,textarea.input,select.input{width:100%;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:var(--cream);font-size:13.5px;outline:none;transition:border-color .3s var(--ease),background .3s var(--ease);}
.input:focus{border-color:rgba(196,106,59,.7);background:rgba(255,255,255,.1);}
textarea.input{resize:vertical;min-height:76px;line-height:1.6;}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
select.input option{background:#1a1a1b;color:var(--cream);}

.lightbox{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:rgba(8,8,9,.9);backdrop-filter:blur(30px) saturate(120%);-webkit-backdrop-filter:blur(30px) saturate(120%);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);}
.lightbox.open{opacity:1;pointer-events:auto;}
.lb-holes{position:absolute;top:0;left:0;right:0;height:14px;opacity:.5;pointer-events:none;background-image:radial-gradient(circle,rgba(232,226,214,.4) 0 2px,transparent 2.8px);background-size:16px 14px;background-position:8px center;}
.lb-top{position:relative;z-index:5;display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:8px 12px;border-radius:16px;background:var(--glass-bg);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transform:translateY(-12px);opacity:0;transition:all .4s var(--fluid-spring);}
.lightbox.open .lb-top{transform:none;opacity:1;}
.lb-heading{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1;}
.lb-name{font-family:var(--serif);font-size:16px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-counter{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);flex:0 0 auto;}
.lb-tools{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
.lb-btn{height:30px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.06em;color:rgba(232,226,214,.78);transition:all .28s var(--ease);white-space:nowrap;}
.lb-btn:hover{background:rgba(255,255,255,.14);color:var(--cream);}
.lb-btn:active{transform:scale(0.95) !important;transition:transform 0.1s var(--fluid-damp);}
.lb-btn.active{color:var(--orange);background:rgba(196,106,59,.16);}
.lb-btn.on{color:var(--orange);}
.lb-btn:disabled{opacity:.3;cursor:not-allowed;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;color:rgba(232,226,214,.8);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:all .3s var(--fluid-spring);}
.lb-nav:hover{background:rgba(255,255,255,.18);color:#fff;transform:translateY(-50%) scale(1.06);}
.lb-nav:active{transform:translateY(-50%) scale(.94) !important;}
.lb-prev{left:22px;}.lb-next{right:22px;}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 90px;position:relative;min-height:0;}
.lb-frame{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative;overflow:hidden;}
@keyframes lb-develop{from{opacity:0;filter:blur(26px);transform:scale(1.05);}to{opacity:1;filter:blur(0);transform:scale(1);}}
.lb-frame.develop{animation:lb-develop .85s var(--ease);}
.lb-img,.lb-video{max-width:100%;max-height:calc(100vh - 250px);object-fit:contain;border-radius:4px;box-shadow:0 34px 90px rgba(0,0,0,.75);transition:transform var(--zoom-dur,0s) var(--ease),filter .5s var(--ease);transform-origin:center center;user-select:none;touch-action:none;will-change:transform,opacity;}
.lb-img.zoomed{cursor:grab;}
.lb-img.zoomed:active{cursor:grabbing;}
.lb-img.sim-warm,.lb-video.sim-warm{filter:sepia(.35) saturate(1.2) contrast(1.05) brightness(1.04) hue-rotate(-6deg);}
.lb-img.sim-bw,.lb-video.sim-bw{filter:grayscale(1) contrast(1.14) brightness(1.02);}
.lb-img.sim-fade,.lb-video.sim-fade{filter:saturate(.62) contrast(.88) brightness(1.08) sepia(.14);}

/* 动效增强版 */
.lb-img.fx-kenburns{animation:fxKenburns 8s ease-in-out infinite alternate;}
@keyframes fxKenburns{0%{transform:scale(1) translate(0, 0);}100%{transform:scale(1.3) translate(-5%, -5%);}}
.lb-img.fx-breathe{animation:fxBreathe 4s ease-in-out infinite;}
@keyframes fxBreathe{0%,100%{transform:scale(1); opacity: 0.4;}50%{transform:scale(1.06); opacity: 1;}}
.lb-img.fx-leak{animation:fxLeak 6s ease-in-out infinite alternate;}
@keyframes fxLeak{0%{box-shadow:inset 0 0 100px rgba(196,106,59,0); transform: scale(1.02) translate(0, 0);}50%{box-shadow:inset 100px 50px 250px rgba(196,106,59,.6), inset -50px -100px 150px rgba(122,46,42,.4); transform: scale(1.05) translate(2%, 2%);}100%{box-shadow:inset -100px -50px 250px rgba(122,46,42,.6), inset 50px 100px 150px rgba(196,106,59,.4); transform: scale(1.02) translate(-2%, -2%);}}
.lb-img.fx-grain{animation:fxGrain 0.4s steps(2) infinite;}
@keyframes fxGrain{0%{transform:scale(1.03) translate(0, 0);}25%{transform:scale(1.04) translate(-2px, 2px);}50%{transform:scale(1.03) translate(2px, -2px);}75%{transform:scale(1.05) translate(-2px, -2px);}100%{transform:scale(1.03) translate(2px, 2px);}}
.lb-img.fx-sway{animation:fxSway 4s ease-in-out infinite;}
@keyframes fxSway{0%,100%{transform:rotate(-2.5deg) scale(1.05);}50%{transform:rotate(2.5deg) scale(1.05);}}

.lb-particle-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;cursor:grab;touch-action:none;display:none;}
.lb-particle-canvas:active{cursor:grabbing;}

.lb-exif{position:absolute;top:80px;right:16px;bottom:130px;width:250px;z-index:6;border-radius:16px;padding:20px;background:var(--glass-bg);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);transform:translateX(20px);opacity:0;pointer-events:none;transition:all .45s var(--fluid-spring);overflow-y:auto;}

.lb-bottom{position:relative;z-index:5;margin:0 16px 16px;padding:12px 18px;border-radius:16px;background:var(--glass-bg);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;gap:18px;transform:translateY(12px);opacity:0;transition:all .4s var(--fluid-spring) .05s;}

.lb-info{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:1;min-width:0;}

.tag-pill{font-size:10.5px;letter-spacing:.1em;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--muted);}
.lb-progress{position:absolute;left:18px;right:18px;bottom:6px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;}

/* 退出动效按钮 */

.floating-backdrop{position:fixed;inset:0;background:transparent;pointer-events:auto;touch-action:none;}

.modal{width:min(520px,100%);max-height:86vh;overflow-y:auto;border-radius:20px;padding:26px;background:rgba(28,28,30,.85);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 30px 80px rgba(0,0,0,.7);transform:scale(.96);transition:transform .35s var(--fluid-spring);}

.btn-primary{padding:10px 22px;border-radius:999px;background:var(--cream);color:#151515;font-size:13px;letter-spacing:.08em;transition:all .3s var(--fluid-spring);}

.btn-primary:active{transform:scale(0.95) !important;}
.btn-ghost{padding:10px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-size:13px;color:var(--muted);transition:all .3s var(--ease);}

.btn-danger{background:rgba(217,112,94,.9);color:#fff;}
.btn-danger:hover{background:#e07d6b;}

.select-bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);z-index:120;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:var(--glass-shadow);opacity:0;pointer-events:none;transition:all .35s var(--fluid-spring);white-space:nowrap;overflow-x:auto;scrollbar-width:none;}

#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(16px);z-index:500;padding:11px 22px;border-radius:999px;font-size:13px;letter-spacing:.06em;background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 14px 40px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:all .35s var(--fluid-spring);max-width:90vw;text-align:center;}

<script>
/* =========================================================
   0. 基础工具
   ========================================================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const appRoot = document.querySelector('#app');
const navEl = $('#nav');
const lbEl = $('#lightbox');

let toastTimer = null;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* =========================================================
   1. IndexedDB
   ========================================================= */
const DB_NAME = 'darkroom-gallery';
const DB_VER = 2;
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('photos'))   db.createObjectStore('photos',   { keyPath: 'id' });
      if (!db.objectStoreNames.contains('albums'))   db.createObjectStore('albums',   { keyPath: 'id' });
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
  return dbPromise;
}
async function idbAll(store) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).getAll();
    r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
  });
}
async function idbGet(store, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbPut(store, val) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(store, 'readwrite').objectStore(store).put(val);
    r.onsuccess = () => res(val); r.onerror = () => rej(r.error);
  });
}
async function idbDel(store, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(store, 'readwrite').objectStore(store).delete(key);
    r.onsuccess = () => res(); r.onerror = () => rej(r.error);
  });
}
async function idbClear(store) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(store, 'readwrite').objectStore(store).clear();
    r.onsuccess = () => res(); r.onerror = () => rej(r.error);
  });
}

/* =========================================================
   2. 全局状态
   ========================================================= */
const DEFAULT_SCENES = [
  { id:'portrait', name:'人像', builtin:true },
  { id:'landscape', name:'风景', builtin:true },
  { id:'sport', name:'运动', builtin:true },
  { id:'food', name:'美食', builtin:true },
  { id:'festival', name:'节日', builtin:true },
  { id:'building', name:'建筑', builtin:true },
  { id:'animal', name:'动物', builtin:true },
  { id:'night', name:'夜景', builtin:true },
  { id:'still', name:'静物', builtin:true },
  { id:'street', name:'街拍', builtin:true }
];

const state = {
  photos: [], albums: [], settings: { filmSim: 'original', homeSort: 'newest', trashRetentionDays: 30 },
  sceneTypes: [], selectMode: false, selected: new Set()
};

const urlCache = new Map();
function photoSrc(p) {
  if (p.blob) {
    if (!urlCache.has(p.id)) urlCache.set(p.id, URL.createObjectURL(p.blob));
    return urlCache.get(p.id);
  }
  return p.src || '';
}
function videoSrc(p) {
  if (p.videoBlob) {
    const k = 'v_' + p.id;
    if (!urlCache.has(k)) urlCache.set(k, URL.createObjectURL(p.videoBlob));
    return urlCache.get(k);
  }
  return p.videoSrc || '';
}
function coverSrc(p) {
  if (p.kind === 'live' && p.coverBlob) {
    const k = 'c_' + p.id;
    if (!urlCache.has(k)) urlCache.set(k, URL.createObjectURL(p.coverBlob));
    return urlCache.get(k);
  }
  return photoSrc(p);
}
function revokePhotoURL(id) {
  ['', 'v_', 'c_'].forEach(pre => {
    const k = pre + id;
    const u = urlCache.get(k);
    if (u) { URL.revokeObjectURL(u); urlCache.delete(k); }
  });
}
const unlockedAlbums = new Set(JSON.parse(sessionStorage.getItem('dr-unlocked') || '[]'));
function saveUnlocked() { sessionStorage.setItem('dr-unlocked', JSON.stringify([...unlockedAlbums])); }
function albumOf(p) { return state.albums.find(a => a.id === p.albumId) || null; }
function isAlbumLocked(a) { return !!(a && a.password && !unlockedAlbums.has(a.id)); }
function sceneName(id) {
  if (!id) return '';
  const s = state.sceneTypes.find(x => x.id === id);
  return s ? s.name : '';
}
function isSceneName(name) {
  return state.sceneTypes.some(s => s.name === name);
}
function visiblePhotos() {
  return state.photos.filter(p => !p.deletedAt && !isAlbumLocked(albumOf(p)));
}
function trashedPhotos() {
  return state.photos.filter(p => p.deletedAt);
}
function getPhoto(id) { return state.photos.find(p => p.id === id) || null; }

function sortPhotos(list, mode = 'newest') {
  const arr = [...list];
  const restoreCmp = (a, b) => (b.restoredAt || 0) - (a.restoredAt || 0);
  if (mode === 'newest') {
    arr.sort((a, b) => { const r = restoreCmp(a, b); if (r) return r; return String(b.date || '').localeCompare(String(a.date || '')); });
  } else if (mode === 'oldest') {
    arr.sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
  } else if (mode === 'recent') {
    arr.sort((a, b) => { const r = restoreCmp(a, b); if (r) return r; return (b.createdAt || 0) - (a.createdAt || 0); });
  } else if (mode === 'fav') {
    arr.sort((a, b) => {
      if (a.favorite !== b.favorite) return a.favorite ? -1 : 1;
      const r = restoreCmp(a, b); if (r) return r;
      return String(b.date || '').localeCompare(String(a.date || ''));
    });
  } else if (mode === 'random') {
    const seed = window.__homeRandomSeed || (window.__homeRandomSeed = Math.random());
    const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
    arr.sort((a, b) => (hash(a.id + seed) % 1000) - (hash(b.id + seed) % 1000));
  }
  return arr;
}

/* =========================================================
   3. 种子数据
   ========================================================= */
const SEED_ALBUMS = [

const EXIF_POOL = [
  { camera:'Fujifilm X-T4', lens:'XF 23mm f/1.4', iso:'ISO 400', aperture:'f/2.0', shutter:'1/250s', focal:'23mm' },
  { camera:'Sony A7 III',   lens:'FE 35mm f/1.8',  iso:'ISO 100', aperture:'f/4.0', shutter:'1/500s', focal:'35mm' },
  { camera:'Canon AE-1',    lens:'FD 50mm f/1.8',  iso:'ISO 200', aperture:'f/2.8', shutter:'1/125s', focal:'50mm' },
  { camera:'Leica Q2',      lens:'Summilux 28mm',  iso:'ISO 320', aperture:'f/1.7', shutter:'1/80s',  focal:'28mm' }
];
async function seedData() {
  for (const a of SEED_ALBUMS) await idbPut('albums', { ...a });
  const now = Date.now();
  for (let i = 0; i < SEED_PHOTOS.length; i++) {
    const s = SEED_PHOTOS[i];
    const sceneObj = state.sceneTypes.find(x => x.id === s.scene);
    const tags = [...(s.tags || [])];
    if (sceneObj && !tags.includes(sceneObj.name)) tags.push(sceneObj.name);
    await idbPut('photos', {
      id: 'seed-' + s.s, title: s.t, date: s.d, place: s.pl, albumId: s.a,
      kind: s.kind || 'photo', tags, note: '', favorite: false,
      createdAt: now - i * 1000, updatedAt: now,
      src: `https://picsum.photos/seed/${s.s}/800/${s.h}`,
      ratio: s.h / 800, exif: EXIF_POOL[i % EXIF_POOL.length],
      privacy: 'public', sortWeight: i,
      scene: s.scene || null, deletedAt: null, restoredAt: null,
      originalBlob: null, videoBlob: null, coverBlob: null
    });
  }
}

/* =========================================================
   4. 路由 + 滚动位置
   ========================================================= */
const routes = {
  home: renderHome, gallery: renderGallery, album: renderAlbum,
  story: renderStory, search: renderSearch, timeline: renderTimeline,
  favorites: renderFavorites, about: renderAbout, upload: renderUpload, trash: renderTrash
};
let currentRoute = 'home';
const scrollKey = 'dr-scroll-map';
let scrollMap = {};
try { scrollMap = JSON.parse(sessionStorage.getItem(scrollKey) || '{}'); } catch(e){}

function saveScrollPosition() {
  scrollMap[location.hash || '#/home'] = window.scrollY;
  try { sessionStorage.setItem(scrollKey, JSON.stringify(scrollMap)); } catch(e){}
}
function restoreScrollPosition() {
  if (parseHash().name !== 'home') {
    window.scrollTo(0, 0);
    updateFabBackState();
    return;
  }
  const y = scrollMap[location.hash || '#/home'];
  if (typeof y === 'number' && y > 0) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      window.scrollTo({ top: y, behavior: 'auto' });
      updateFabBackState();
    }));
  } else {
    window.scrollTo({ top: 0, behavior: 'auto' });
    updateFabBackState();
  }

function parseHash() {

/* =========================================================
   5. 滚动回退栈 + 手动平滑滚动
   ========================================================= */
const scrollStackByRoute = {};
let isProgrammaticScroll = false;
let scrollRecordTimer = null;
let programmaticTimer = null;
let smoothScrollRaf = null;

function currentHashKey() { return location.hash || '#/home'; }
function getScrollStack() {
  const k = currentHashKey();
  if (!scrollStackByRoute[k]) scrollStackByRoute[k] = [0];
  return scrollStackByRoute[k];
}
function updateFabBackState() {
  const stack = getScrollStack();
  const btn = $('#fabBack');
  if (!btn) return;
  const usable = stack.length > 1 || (stack.length === 1 && Math.abs(window.scrollY - stack[0]) > 80);
  btn.disabled = !usable;
}
function recordScroll() {
  if (isProgrammaticScroll) return;
  const stack = getScrollStack();
  const y = window.scrollY;
  const last = stack[stack.length - 1];
  if (Math.abs(y - last) < 80) return;
  stack.push(y);
  if (stack.length > 30) stack.shift();
  updateFabBackState();
}
window.addEventListener('scroll', () => {
  clearTimeout(scrollRecordTimer);
  scrollRecordTimer = setTimeout(recordScroll, 500);
  updateFabBackState();
}, { passive: true });

function smoothScrollTo(targetY, duration = 800) {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { window.scrollTo(0, targetY); return; }
  if (smoothScrollRaf) cancelAnimationFrame(smoothScrollRaf);
  const startY = window.scrollY;
  const distance = targetY - startY;
  if (Math.abs(distance) < 1) return;
  let startTime = null;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = ts => {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const p = Math.min(elapsed / duration, 1);
    window.scrollTo(0, startY + distance * ease(p));
    if (p < 1) smoothScrollRaf = requestAnimationFrame(step);
    else smoothScrollRaf = null;
  };
  smoothScrollRaf = requestAnimationFrame(step);
}

function doScrollBack() {
  const stack = getScrollStack();
  while (stack.length && Math.abs(window.scrollY - stack[stack.length - 1]) < 80) stack.pop();
  if (!stack.length) { toast('没有更早的浏览位置了'); updateFabBackState(); return; }
  const target = stack.pop();
  isProgrammaticScroll = true;
  smoothScrollTo(target, 800);
  clearTimeout(programmaticTimer);
  programmaticTimer = setTimeout(() => { isProgrammaticScroll = false; updateFabBackState(); }, 850);
  updateFabBackState();
}
function doScrollTop() {
  isProgrammaticScroll = true;
  smoothScrollTo(0, 800);
  clearTimeout(programmaticTimer);
  programmaticTimer = setTimeout(() => { isProgrammaticScroll = false; }, 850);
}
function doScrollBottom() {
  isProgrammaticScroll = true;
  smoothScrollTo(document.body.scrollHeight, 800);
  clearTimeout(programmaticTimer);
  programmaticTimer = setTimeout(() => { isProgrammaticScroll = false; }, 850);
}

const masonryRegistry = [];
function layoutMasonry(container, cards) {
  const w = container.clientWidth; if (!w) return;
  const gap = 18;
  let cols = 4;
  if (w < 1180) cols = 3;
  if (w < 820)  cols = 2;
  if (w < 430)  cols = 1;
  const colW = (w - gap * (cols - 1)) / cols;
  const heights = new Array(cols).fill(0);
  cards.forEach(card => {
    const ratio = parseFloat(card.dataset.ratio) || 1.3;
    let h = colW * ratio;
    if (card.dataset.kind === 'polaroid') h = colW * ratio + 36;
    if (card.dataset.kind === 'film') h = colW * ratio + 48;
    let col = 0;
    for (let i = 1; i < cols; i++) if (heights[i] < heights[col]) col = i;
    const x = col * (colW + gap), y = heights[col];
    card.style.width = colW + 'px'; card.style.height = h + 'px';
    card.style.left = x + 'px'; card.style.top = y + 'px';
    heights[col] = y + h + gap;
  });
  container.style.height = (Math.max(...heights) - gap) + 'px';
}
function renderMasonry(container, photos, opts = {}) {
  container.innerHTML = '';
  container.classList.add('masonry');
  if (!photos.length) { container.style.height = '0px'; return; }
  const cards = photos.map((p, i) => { const c = makeCard(p, i, opts); container.appendChild(c); return c; });
  const layout = () => layoutMasonry(container, cards);
  masonryRegistry.push(layout);
  requestAnimationFrame(layout);
}
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => masonryRegistry.forEach(fn => fn()), 120);
});

function clampPan() {
  if (LB.zoom <= 1.001) { LB.panX = 0; LB.panY = 0; return; }
  const img = $('#lbImg');
  const frame = $('#lbFrame');
  if (!img || !frame || !img.naturalWidth) return;
  const imgRatio = img.naturalWidth / img.naturalHeight;
  const frameRatio = frame.clientWidth / frame.clientHeight;
  let dw, dh;
  if (imgRatio > frameRatio) { dw = frame.clientWidth; dh = dw / imgRatio; }
  else { dh = frame.clientHeight; dw = dh * imgRatio; }
  const maxX = Math.max(0, (dw * LB.zoom - frame.clientWidth) / 2);
  const maxY = Math.max(0, (dh * LB.zoom - frame.clientHeight) / 2);
  LB.panX = Math.max(-maxX, Math.min(maxX, LB.panX));
  LB.panY = Math.max(-maxY, Math.min(maxY, LB.panY));
}
function applyZoom(transitionType = 'none') {
  const img = $('#lbImg');
  if (!img) return;
  const dur = transitionType === 'wheel' ? '.15s' : transitionType === 'smooth' ? '.3s' : '0s';
  img.style.setProperty('--zoom-dur', dur);
  if (LB.zoom <= 1.001 && Math.abs(LB.panX) < 0.5 && Math.abs(LB.panY) < 0.5) {
    img.style.transform = '';
    img.classList.remove('zoomed');
  } else {
    img.style.transform = `translate(${LB.panX}px, ${LB.panY}px) scale(${LB.zoom})`;
    img.classList.add('zoomed');
  }
}
function resetZoom(animate = false) {
  LB.zoom = 1; LB.panX = 0; LB.panY = 0; LB.isPanning = false;
  LB.pinchStartDist = 0; LB.pinchStartZoom = 1;
  applyZoom(animate ? 'smooth' : 'none');
}
function setZoom(newZoom, centerX, centerY, transitionType = 'wheel') {
  const img = $('#lbImg');
  if (!img) return;
  if (LB.motion) stopMotion();
  newZoom = Math.max(1, Math.min(4, newZoom));
  if (Math.abs(newZoom - LB.zoom) < 0.001) return;
  const stage = $('#lbStage');
  const stageRect = stage.getBoundingClientRect();
  const mx = centerX - (stageRect.left + stageRect.width / 2);
  const my = centerY - (stageRect.top + stageRect.height / 2);
  const scaleDiff = newZoom / LB.zoom;
  LB.panX = mx - (mx - LB.panX) * scaleDiff;
  LB.panY = my - (my - LB.panY) * scaleDiff;
  LB.zoom = newZoom;
  if (LB.zoom <= 1.001) { LB.zoom = 1; LB.panX = 0; LB.panY = 0; }
  clampPan();
  applyZoom(transitionType);
}

function startParticleEffect(img) {
  const canvas = $('#lbParticleCanvas');
  const frame = $('#lbFrame');
  if (!canvas || !frame) return;
  if (!img.naturalWidth) { toast('图片还在加载…'); return; }

  const dpr = window.devicePixelRatio || 1;
  const rect = frame.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  canvas.style.display = 'block';
  
  particleCtx = canvas.getContext('2d');
  particleCtx.scale(dpr, dpr);
  
  img.style.opacity = '0';

  const offCanvas = document.createElement('canvas');
  offCanvas.width = img.naturalWidth;
  offCanvas.height = img.naturalHeight;
  const offCtx = offCanvas.getContext('2d');
  offCtx.drawImage(img, 0, 0);

  particles = [];
  let data;
  try {
    data = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;
  } catch (err) {
    toast('外链图片不支持 3D 粒子效果，请重新上传');
    stopParticleEffect();
    return;
  }

  const targetCount = 4000;
  const step = Math.max(3, Math.round(Math.sqrt((img.naturalWidth * img.naturalHeight) / targetCount)));
  const scaleToFit = Math.min(rect.width / img.naturalWidth, rect.height / img.naturalHeight) * 0.85;

  for (let y = 0; y < offCanvas.height; y += step) {
    for (let x = 0; x < offCanvas.width; x += step) {
      const i = (y * offCanvas.width + x) * 4;
      if (data[i + 3] > 0) {
        particles.push({
          baseX: (x - img.naturalWidth / 2) * scaleToFit,
          baseY: (y - img.naturalHeight / 2) * scaleToFit,
          z: (Math.random() - 0.5) * 50,
          r: data[i], g: data[i+1], b: data[i+2],
          size: Math.random() * 1.5 + 0.5,
          jitterX: (Math.random() - 0.5) * 2,
          jitterY: (Math.random() - 0.5) * 2
        });
      }
    }
  }

  particleTargetAngle = { x: 0, y: 0 };
  particleCurrentAngle = { x: 0, y: 0 };
  particleVelocity = { x: 0, y: 0 };
  
  let startX = 0, startY = 0, isDragged = false;

  canvas.onpointerdown = e => {
    isDraggingParticle = true;
    isDragged = false;
    startX = e.clientX;
    startY = e.clientY;
    lastMousePos = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
  };
  canvas.onpointermove = e => {
    if (!isDraggingParticle) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragged = true;
    
    const moveX = e.clientX - lastMousePos.x;
    const moveY = e.clientY - lastMousePos.y;
    particleVelocity.x = moveY * 0.005;
    particleVelocity.y = moveX * 0.005;
    particleTargetAngle.x += particleVelocity.x;
    particleTargetAngle.y += particleVelocity.y;
    lastMousePos = { x: e.clientX, y: e.clientY };
  };
  canvas.onpointerup = e => {
    isDraggingParticle = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!isDragged) {
      e.stopPropagation();
      stopMotion();
    } else if (dy > 80 && Math.abs(dy) > Math.abs(dx)) {
      stopMotion();
    }
  };

  const stopTouch = e => e.stopPropagation();
  canvas.addEventListener('touchstart', stopTouch, { passive: false });
  canvas.addEventListener('touchmove', stopTouch, { passive: false });
  canvas.addEventListener('touchend', stopTouch, { passive: false });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  function render() {
    if (!particleCtx) return;
    if (!isDraggingParticle) {
      particleVelocity.x *= 0.95;
      particleVelocity.y *= 0.95;
      particleTargetAngle.x += particleVelocity.x;
      particleTargetAngle.y += particleVelocity.y;
    }
    particleCurrentAngle.x += (particleTargetAngle.x - particleCurrentAngle.x) * 0.1;
    particleCurrentAngle.y += (particleTargetAngle.y - particleCurrentAngle.y) * 0.1;
    
    const cosX = Math.cos(particleCurrentAngle.x);
    const sinX = Math.sin(particleCurrentAngle.x);
    const cosY = Math.cos(particleCurrentAngle.y);
    const sinY = Math.sin(particleCurrentAngle.y);
    
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    particleCtx.clearRect(0, 0, rect.width, rect.height);
    
    for (let p of particles) {
      const jx = Math.sin(Date.now() * 0.002 + p.baseX) * p.jitterX;
      const jy = Math.cos(Date.now() * 0.002 + p.baseY) * p.jitterY;
      let x1 = p.baseX + jx;
      let y1 = p.baseY + jy;
      let z1 = p.z;
      let x2 = x1 * cosY - z1 * sinY;
      let z2 = x1 * sinY + z1 * cosY;
      let y2 = y1 * cosX - z2 * sinX;
      let z3 = y1 * sinX + z2 * cosX;
      const fov = 800;
      const scale = fov / (fov + z3);
      const screenX = cx + x2 * scale;
      const screenY = cy + y2 * scale;
      
      particleCtx.fillStyle = `rgba(${p.r},${p.g},${p.b},${scale * 0.8})`;
      particleCtx.beginPath();
      particleCtx.arc(screenX, screenY, p.size * scale, 0, Math.PI * 2);
      particleCtx.fill();
    }
    particleAnimId = requestAnimationFrame(render);
  }
  render();
}

function stopParticleEffect() {
  if (particleAnimId) {
    cancelAnimationFrame(particleAnimId);
    particleAnimId = null;
  }
  particleCtx = null;
  particles = [];
  const canvas = $('#lbParticleCanvas');
  if (canvas) {
    canvas.style.display = 'none';
    canvas.onpointerdown = null;
    canvas.onpointermove = null;
    canvas.onpointerup = null;
  }
  const img = $('#lbImg');
  if (img) img.style.opacity = '1';
}

function doApplyMotion(id) {
  stopMotion();
  const img = $('#lbImg'); if (!img) return;
  
  if (id === 'particle') {
    startParticleEffect(img);
  } else {
    const m = MOTION_LIST.find(x => x.id === id);
    if (!m || !m.cls) return;
    img.classList.add(m.cls);
  }
  
  LB.motion = id;
  const btn = $('.lb-btn[data-lb="motion"]');
  if (btn) { btn.textContent = '动效 ✓'; btn.classList.add('active'); }
  
  const exitBtn = $('#lbExitMotion');
  if (exitBtn) {
    exitBtn.classList.remove('shift-for-exif', 'hide-for-exif');
    if (LB.exifOpen && window.innerWidth > 860) {
      exitBtn.classList.add('shift-for-exif');
    }
    if (LB.exifOpen && window.innerWidth <= 860) {
      exitBtn.classList.add('hide-for-exif');
    }
    exitBtn.classList.add('show');
  }
  
  toast(id === 'particle' ? '动效 · 星尘浮现' : '动效 · ' + MOTION_LIST.find(x=>x.id===id).name);
}

function applyMotion(id) {
  if (LB.motionPending) { clearTimeout(LB.motionPending); LB.motionPending = null; }
  const needsReset = LB.zoom > 1.001 || Math.abs(LB.panX) > 0.5 || Math.abs(LB.panY) > 0.5;
  if (needsReset) {
    stopMotion();
    resetZoom(true);
    LB.motionPending = setTimeout(() => { LB.motionPending = null; doApplyMotion(id); }, 320);
  } else {
    doApplyMotion(id);
  }
}

function stopMotion() {
  if (LB.motionPending) { clearTimeout(LB.motionPending); LB.motionPending = null; }
  stopParticleEffect();
  
  const img = $('#lbImg');
  if (img) {
    MOTION_LIST.forEach(m => { if (m.cls) img.classList.remove(m.cls); });
    img.style.transform = '';
    img.style.opacity = '';
  }
  LB.motion = null;
  const btn = $('.lb-btn[data-lb="motion"]');
  if (btn) { btn.textContent = '动效'; btn.classList.remove('active'); }
  
  const exitBtn = $('#lbExitMotion');
  if (exitBtn) {
    exitBtn.classList.remove('show', 'hide-for-exif');
    setTimeout(() => {
      exitBtn.classList.remove('shift-for-exif');
    }, 350);
  }
}

function renderLightbox(animate) {
  const p = currentLbPhoto(); if (!p) return;
  const frame = $('#lbFrame');
  const isVideo = p.kind === 'live';
  const src = isVideo ? videoSrc(p) : photoSrc(p);
  const simClass = LB.filmSim !== 'original' ? ' sim-' + LB.filmSim : '';
  if (isVideo) {
    frame.innerHTML = `<video class="lb-video${simClass}" id="lbVideo" src="${esc(src)}" controls playsinline loop muted autoplay></video>`;
  } else {
    frame.innerHTML = `<img class="lb-img${simClass}" id="lbImg" src="${esc(src)}" alt="${esc(p.title)}" draggable="false"><canvas id="lbParticleCanvas" class="lb-particle-canvas"></canvas>`;
  }
  if (animate) { frame.classList.remove('develop'); void frame.offsetWidth; frame.classList.add('develop'); }
  const imgEl = isVideo ? $('#lbVideo') : $('#lbImg');
  if (!isVideo && imgEl) {
    imgEl.addEventListener('dblclick', e => {
      e.preventDefault();
      if (LB.motion === 'particle') return;
      if (LB.zoom > 1.001) resetZoom(true);
      else setZoom(2, e.clientX, e.clientY, 'smooth');
      frame.classList.remove('bump'); void frame.offsetWidth; frame.classList.add('bump');
    });
    imgEl.addEventListener('click', e => {
      if (LB.motion === 'particle') return;
      if (LB.exifOpen && LB.zoom <= 1.001) {
        e.stopPropagation();
        closeExifPanel();
        return;
      }
      if (window.innerWidth <= 860 && LB.zoom <= 1.001) {
        e.stopPropagation();
        closeMenus();
        LB.uiHidden = !LB.uiHidden;
        lbEl.classList.toggle('ui-hidden', LB.uiHidden);
      }
    });
    imgEl.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return;
      if (LB.zoom <= 1.001) return;
      if (LB.isPanning) return;
      if (LB.motion) stopMotion();
      LB.isPanning = true;
      LB.panStartX = e.clientX - LB.panX;
      LB.panStartY = e.clientY - LB.panY;
      try { imgEl.setPointerCapture(e.pointerId); } catch(err) {}
    });
    imgEl.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      if (!LB.isPanning) return;
      e.preventDefault();
      LB.panX = e.clientX - LB.panStartX;
      LB.panY = e.clientY - LB.panStartY;
      clampPan();
      applyZoom('none');
    });
    const endPan = e => {
      if (e.pointerType === 'touch') return;
      if (!LB.isPanning) return;
      LB.isPanning = false;
      try { imgEl.releasePointerCapture(e.pointerId); } catch(err) {}
    };
    imgEl.addEventListener('pointerup', endPan);
    imgEl.addEventListener('pointercancel', endPan);
  }
  if (imgEl && !isVideo) {
    if (imgEl.complete) { clampPan(); applyZoom('none'); }
    else imgEl.onload = () => { clampPan(); applyZoom('none'); };
  }
  $('#lbName').textContent = p.title || '未命名';
  $('#lbCounter').textContent = `${pad2(LB.index + 1)} / ${pad2(LB.ids.length)}`;
  $$('[data-lb="fav"]').forEach(b => { b.textContent = p.favorite ? '收藏 ✓' : '收藏'; b.classList.toggle('on', !!p.favorite); });
  const filmBtn = $('.lb-btn[data-lb="film"]');
  filmBtn.classList.toggle('active', LB.filmSim !== 'original');
  const slideBtn = $('.lb-btn[data-lb="slideshow"]');
  slideBtn.textContent = LB.slideshow ? '暂停' : '幻灯片';
  slideBtn.classList.toggle('active', LB.slideshow);
  $('.lb-btn[data-lb="exif"]').classList.toggle('active', LB.exifOpen);
  $('#lbExif').classList.toggle('open', LB.exifOpen);
  
  const motionBtn = $('.lb-btn[data-lb="motion"]');
  if (motionBtn) {
    motionBtn.disabled = isVideo;
    motionBtn.title = isVideo ? '视频无需动效' : '选择动效';
    motionBtn.textContent = LB.motion ? '动效 ✓' : '动效';
    motionBtn.classList.toggle('active', !!LB.motion);
  }
  
  if (!LB.motion) {
    const exitBtn = $('#lbExitMotion');
    if (exitBtn) exitBtn.classList.remove('show', 'shift-for-exif', 'hide-for-exif');
  }

  renderExif(p);
  const album = albumOf(p);
  const tags = (p.tags || []).map(t => `<span class="tag-pill">${esc(t)}</span>`).join('');
  $('#lbInfo').innerHTML = `
    <span class="li-title">${esc(p.title || '未命名')}</span>
    <span class="li-dot">·</span><span class="li-meta">${esc(p.date || '—')}</span>
    ${p.place ? `<span class="li-dot">·</span><span class="li-meta">${esc(p.place)}</span>` : ''}
    ${album ? `<span class="li-dot">·</span><span class="li-meta">${esc(album.name)}</span>` : ''}
    ${tags}
    <span class="li-dot">·</span><span class="li-meta">${pad2(LB.index + 1)}/${pad2(LB.ids.length)}</span>`;
  const prevBtn = $('.lb-prev'); const nextBtn = $('.lb-next');
  if (prevBtn) prevBtn.style.display = LB.ids.length > 1 ? '' : 'none';
  if (nextBtn) nextBtn.style.display = LB.ids.length > 1 ? '' : 'none';
}

function renderExif(p) {
  const e = p.exif || {};
  const hasData = e && (e.camera || e.lens || e.iso || e.aperture || e.shutter || e.focal);
  if (!hasData) {
    $('#lbExifList').innerHTML = '<div class="exif-row"><dt>提示</dt><dd style="text-align:right;font-family:var(--sans);font-size:11px;">这张照片没有 EXIF 信息（上传时已压缩或原始文件无元数据）</dd></div>';
    return;
  }
  const rows = [['相机', e.camera], ['镜头', e.lens], ['ISO', e.iso], ['光圈', e.aperture], ['快门', e.shutter], ['焦距', e.focal]];
  $('#lbExifList').innerHTML = rows.map(([k, v]) => `<div class="exif-row"><dt>${k}</dt><dd>${esc(v || '—')}</dd></div>`).join('') +
    `<div class="exif-row"><dt>尺寸比</dt><dd>${(p.ratio || 1.3).toFixed(2)}</dd></div>`;
}

function lbGo(delta) {
  if (!LB.ids.length) return;
  closeMenus();
  stopMotion();
  resetZoom(false);
  LB.wasPinching = false;
  closeExifPanel();
  LB.index = (LB.index + delta + LB.ids.length) % LB.ids.length;
  renderLightbox(true);
  if (LB.slideshow) {
    clearTimeout(LB.timer);
    startProgress();
    LB.timer = setTimeout(nextSlide, 4000);
  }
}

lbEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-lb]');
  if (btn) { e.stopPropagation(); handleLbAction(btn.dataset.lb); return; }

  if (e.target.closest('.lb-exif')) return;

  if (LB.exifOpen) {
    closeExifPanel();
    closeMenus();
    return;
  }

  closeMenus();
  if (e.target.id === 'lbStage' || e.target.classList.contains('lb-frame')) closeLightbox();
});

$('#lbStage').addEventListener('wheel', e => {
  e.preventDefault();
  if (LB.motion === 'particle') return;
  const delta = e.deltaY > 0 ? -0.15 : 0.15;
  setZoom(LB.zoom + delta, e.clientX, e.clientY);
}, { passive: false });

let touchStartX = 0, touchStartY = 0, touchLastX = 0, touchLastY = 0, touching = false;
$('#lbStage').addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    LB.wasPinching = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    LB.pinchStartDist = Math.sqrt(dx * dx + dy * dy);
    LB.pinchStartZoom = LB.zoom;
    touching = false;
  } else if (e.touches.length === 1) {
    LB.wasPinching = false;
    touchStartX = touchLastX = e.touches[0].clientX;
    touchStartY = touchLastY = e.touches[0].clientY;
    touching = true;
  }
}, { passive: true });
$('#lbStage').addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (LB.pinchStartDist > 0) {
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      setZoom(LB.pinchStartZoom * (dist / LB.pinchStartDist), cx, cy, 'none');
    }
  } else if (e.touches.length === 1 && LB.zoom > 1.001 && touching) {
    e.preventDefault();
    LB.panX += e.touches[0].clientX - touchLastX;
    LB.panY += e.touches[0].clientY - touchLastY;
    touchLastX = e.touches[0].clientX;
    touchLastY = e.touches[0].clientY;
    clampPan();
    applyZoom('none');
  }
}, { passive: false });
$('#lbStage').addEventListener('touchend', e => {
  if (e.touches.length === 1) {
    LB.wasPinching = false;
    touching = true;
    touchStartX = touchLastX = e.touches[0].clientX;
    touchStartY = touchLastY = e.touches[0].clientY;
    LB.pinchStartDist = 0;
    return;
  }
  if (e.touches.length === 0) {
    if (LB.wasPinching) { LB.wasPinching = false; touching = false; return; }
    if (LB.zoom > 1.001) { touching = false; return; }
    if (!touching) return;
    touching = false;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) lbGo(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeLightbox();
  }
}, { passive: true });

document.addEventListener('keydown', e => {
  if (!lbEl.classList.contains('open')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (activeModals.length) return;
  if (activeMenus.length) {
    if (e.key === 'Escape') { closeMenus(); e.preventDefault(); }
    return;
  }
  switch (e.key) {
    case 'ArrowLeft': lbGo(-1); break;
    case 'ArrowRight': lbGo(1); break;
    case 'Escape':
      if (LB.motion) { stopMotion(); }
      else { closeLightbox(); }
      break;
    case 'f': case 'F': handleLbAction('fav'); break;
    case 'd': case 'D': handleLbAction('download'); break;
    case 'i': case 'I': handleLbAction('exif'); break;
    case ' ': e.preventDefault(); handleLbAction('slideshow'); break;
  }
});

async function handleLbAction(action) {
  const p = currentLbPhoto(); if (!p) return;
  switch (action) {
    case 'close': closeLightbox(); break;
    case 'prev': lbGo(-1); break;
    case 'next': lbGo(1); break;
    case 'fav': await toggleFavorite(p.id); renderLightbox(false); break;
    case 'download': downloadPhoto(p); break;
    case 'share': sharePhoto(p); break;
    case 'edit': openEditDialog(p, () => { renderLightbox(false); refreshCurrentView(); }); break;
    case 'retouch': openRetouchEditor(p); break;
    case 'film': {
      const i = FILM_SIMS.indexOf(LB.filmSim);
      LB.filmSim = FILM_SIMS[(i + 1) % FILM_SIMS.length];
      state.settings.filmSim = LB.filmSim;
      idbPut('settings', { key: 'filmSim', value: LB.filmSim });
      const el = p.kind === 'live' ? $('#lbVideo') : $('#lbImg');
      if (el) el.className = (p.kind === 'live' ? 'lb-video' : 'lb-img') + (LB.filmSim !== 'original' ? ' sim-' + LB.filmSim : '') + (LB.motion ? ' ' + (MOTION_LIST.find(x=>x.id===LB.motion)?.cls||'') : '');
      $('.lb-btn[data-lb="film"]').classList.toggle('active', LB.filmSim !== 'original');
      toast('胶片模拟 · ' + FILM_LABEL[LB.filmSim]);
      break;
    }
    case 'motion': {
      const r = $('.lb-btn[data-lb="motion"]').getBoundingClientRect();
      openMotionMenu(r.left - 80, r.bottom + 8);
      break;
    }
    case 'slideshow': toggleSlideshow(); break;
    case 'fullscreen': toggleFullscreen(); break;
    case 'exif':
      closeMenus();
      LB.exifOpen = !LB.exifOpen;
      $('.lb-btn[data-lb="exif"]').classList.toggle('active', LB.exifOpen);
      $('#lbExif').classList.toggle('open', LB.exifOpen);
      
      const exitBtn = $('#lbExitMotion');
      if (exitBtn && LB.motion) {
        if (window.innerWidth > 860) {
          exitBtn.classList.toggle('shift-for-exif', LB.exifOpen);
        } else {
          exitBtn.classList.toggle('hide-for-exif', LB.exifOpen);
        }
      }
      break;
    case 'more': {
      if (LB.exifOpen) closeExifPanel();
      const r = $('.lb-btn[data-lb="more"]').getBoundingClientRect();
      openPhotoMenu(p.id, r.left - 140, r.bottom + 8);
      break;
    }
  }
}

function openMotionMenu(x, y) {
  const p = currentLbPhoto();
  if (!p) return;
  if (p.kind === 'live') { toast('视频无需动效'); return; }
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.innerHTML = `
    ${MOTION_LIST.map(m => `
      <button data-motion="${m.id}" style="display:flex;justify-content:space-between;align-items:center;${LB.motion === m.id ? 'color:var(--orange);' : ''}">
        <span>${m.name}</span>
        ${LB.motion === m.id ? '<span>✓</span>' : ''}
      </button>
    `).join('')}
    <div class="sep"></div>
    <button data-motion="stop">停止动效</button>`;
  menu.addEventListener('click', e => {
    e.stopPropagation();
    const id = e.target.closest('[data-motion]')?.dataset.motion;
    if (!id) return;
    closeMenus();
    if (id === 'stop') { stopMotion(); return; }
    applyMotion(id);
  });
  openFloatingLayer(menu, 350, x, y);
}

$('#lbExitMotion').addEventListener('click', e => {
  e.stopPropagation();
  stopMotion();
  toast('已退出动效');
});

function toggleSlideshow() {
  LB.slideshow = !LB.slideshow;
  const btn = $('.lb-btn[data-lb="slideshow"]');
  if (LB.slideshow) {
    if (btn) { btn.textContent = '暂停'; btn.classList.add('active'); }
    toast('幻灯片播放中 · 空格暂停');
    startProgress();
    LB.timer = setTimeout(nextSlide, 4000);
  } else stopSlideshow();
}
function nextSlide() {
  if (!LB.slideshow) return;
  lbGo(1);
}
function stopSlideshow() {
  LB.slideshow = false; clearTimeout(LB.timer); LB.timer = null;
  const btn = $('.lb-btn[data-lb="slideshow"]');
  if (btn) { btn.textContent = '幻灯片'; btn.classList.remove('active'); }
  resetProgress();
}
function startProgress() {
  const bar = $('#lbProgress');
  bar.style.transition = 'none'; bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = 'width 4s linear'; bar.style.width = '100%';
  }));
}
function resetProgress() {
  const bar = $('#lbProgress'); bar.style.transition = 'none'; bar.style.width = '0%';
}
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen || (() => {})).call(document.documentElement);
  } else document.exitFullscreen && document.exitFullscreen();
}
async function downloadPhoto(p) {
  try {
    let blob, ext = 'jpg';
    if (p.kind === 'live' && p.videoBlob) { blob = p.videoBlob; ext = 'mp4'; }
    else if (p.blob) blob = p.blob;
    else {
      const res = await fetch(p.src, { mode: 'cors' });
      if (!res.ok) throw new Error('fetch failed');
      blob = await res.blob();
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${(p.title || 'photo').replace(/[\\/:*?"<>|]/g, '_')}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('已开始下载');
  } catch (err) { toast('下载失败：可能受跨域限制'); }
}
async function sharePhoto(p) {
  const url = location.origin + location.pathname + `#/home?photo=${p.id}`;
  if (navigator.share) {
    try { await navigator.share({ title: p.title || '暗房画廊', text: p.title, url }); return; } catch (e) {}
  }
  const ok = await copyText(url);
  toast(ok ? '链接已复制' : '复制失败');
}
async function copyText(text) {
  try { if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    return true;
  } catch (e) { return false; }
}
async function copyImage(p) {
  if (location.protocol === 'file:') {
    return toast('本地文件直接打开无法复制图片，请启动本地服务器访问');
  }
  if (!navigator.clipboard || !window.ClipboardItem) {
    return toast('当前浏览器不支持复制图片');
  }
  try {
    let blob = p.blob;
    if (!blob) {
      try {
        const res = await fetch(p.src, { mode: 'cors' });
        if (!res.ok) throw new Error('fetch failed');
        blob = await res.blob();
      } catch (err) {
        return toast('图片获取失败，可能受跨域限制');
      }
    }
    const item = new ClipboardItem({ [blob.type || 'image/jpeg']: blob });
    await navigator.clipboard.write([item]);
    toast('图片已复制');
  } catch (e) {
    if (e.name === 'NotAllowedError') {
      toast('复制被浏览器拒绝，请检查剪贴板权限');
    } else {
      toast('当前浏览器不支持复制图片');
    }
  }
}

let activeModals = [];
function closeAllModals() {
  activeModals.forEach(m => { try { m.close(); } catch(e){} });
  activeModals = [];
}
function makeModal(html, opts = {}) {
  if (activeModals.length > 0) {
    activeModals.forEach(m => {
      try {
        if (m.mask) {
          m.mask.classList.remove('open');
          setTimeout(() => { try { m.mask.remove(); } catch(e){} }, 50);
        }
      } catch(e) {}
    });
    activeModals = [];
  }
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(mask);
  requestAnimationFrame(() => mask.classList.add('open'));
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    mask.classList.remove('open');
    setTimeout(() => mask.remove(), 300);
    activeModals = activeModals.filter(m => m.mask !== mask);
    document.removeEventListener('keydown', escHandler);
    opts.onClose && opts.onClose();
  };
  const escHandler = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', escHandler);
  activeModals.push({ mask, close });
  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  mask.addEventListener('wheel', e => { if (!e.target.closest('.modal')) { e.preventDefault(); close(); } }, { passive: false });
  mask.addEventListener('touchmove', e => { if (!e.target.closest('.modal')) { e.preventDefault(); close(); } }, { passive: false });
  return { mask, close, root: mask.querySelector('.modal') };
}

function pickTodayPhoto(list) {
  if (!list.length) return null;
  return list[Math.floor(Date.now() / 86400000) % list.length];
}

let quickNavScrollHandler = null;

function initQuickNav(photos) {
  const nav = $('#quickNav');
  if (!nav) return;
  
  if (quickNavScrollHandler) {
    window.removeEventListener('scroll', quickNavScrollHandler);
    quickNavScrollHandler = null;
  }
  nav.innerHTML = '';
  
  if (window.innerWidth <= 860 || photos.length <= 20) {
    nav.classList.remove('visible');
    return;
  }

  const CHUNK = 20;
  const chunks = [];
  for (let i = 0; i < photos.length; i += CHUNK) {
    chunks.push(photos.slice(i, i + CHUNK));
  }

  const dots = [];
  chunks.forEach((chunk, index) => {
    const start = index * CHUNK + 1;
    const end = Math.min((index + 1) * CHUNK, photos.length);
    const dot = document.createElement('div');
    dot.className = 'qn-dot';
    dot.innerHTML = `<div class="qn-tooltip">${start}-${end}</div>`;
    dot.addEventListener('click', () => {
      const firstPhoto = chunk[0];
      const card = document.querySelector(`.photo-card[data-id="${firstPhoto.id}"]`);
      if (card) {
        const top = card.getBoundingClientRect().top + window.scrollY - 100;
        smoothScrollTo(top, 800);
      }
    });
    nav.appendChild(dot);
    dots.push({ el: dot, firstId: chunk[0].id });
  });

  nav.classList.add('visible');

  quickNavScrollHandler = () => {
    let activeIndex = 0;
    const wall = $('#wall');
    if (!wall) return;
    const cards = Array.from(wall.querySelectorAll('.photo-card'));
    if (!cards.length) return;

    const scrollMid = window.scrollY + window.innerHeight / 3;
    for (let i = 0; i < dots.length; i++) {
      const card = document.querySelector(`.photo-card[data-id="${dots[i].firstId}"]`);
      const cardTop = card ? card.getBoundingClientRect().top + window.scrollY : Infinity;
      if (card && cardTop <= scrollMid) {
        activeIndex = i;
      } else {
        break;
      }
    }
    
    dots.forEach((d, i) => d.el.classList.toggle('active', i === activeIndex));
  };
  window.addEventListener('scroll', quickNavScrollHandler, { passive: true });
  quickNavScrollHandler();
}

function pickFilmstripPhotos(list) {
  const now = Date.now();
  const thirtyDays = 30 * 86400000;
  const filmOnly = list.filter(p => p.kind === 'film');
  const photoOnly = list.filter(p => p.kind === 'photo');
  const filmPicked = sortPhotos(filmOnly, 'newest').slice(0, 12);
  if (filmPicked.length >= 12) return filmPicked;
  const need = 12 - filmPicked.length;
  const seen = new Set(filmPicked.map(p => p.id));
  const recent = photoOnly.filter(p => {
    const t = p.createdAt || (p.date ? new Date(p.date).getTime() : 0);
    return now - t < thirtyDays && !seen.has(p.id);
  });
  const photoPicked = [];
  recent.forEach(p => { if (photoPicked.length < need) photoPicked.push(p); });
  if (photoPicked.length < need) {
    const sorted = sortPhotos(photoOnly, 'newest');
    for (const p of sorted) {
      if (photoPicked.length >= need) break;
      if (!seen.has(p.id)) { photoPicked.push(p); seen.add(p.id); }
    }
  }
  return [...filmPicked, ...photoPicked];
}

function filmstripHTML(photos) {
  if (!photos.length) return `<div class="empty">暂无照片</div>`;
  return `<div class="filmstrip">

    <div class="film-track">

  </div>`;
}

function polaroidGridHTML(photos) {
  return photos.map((p, i) => {
    const rot = (((hashStr(p.id) % 50) / 10) - 2.5).toFixed(1);
    return `<div class="polaroid-card" data-id="${esc(p.id)}" style="--i:${i};--rot:${rot}deg">
      <div class="pc-media"><img src="${esc(photoSrc(p))}" alt="${esc(p.title)}" loading="lazy" draggable="false"></div>
      <div class="pc-title">${esc(p.title)}</div>
      <div class="pc-date">${esc(p.date || '')}</div>
    </div>`;
  }).join('');
}
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) >>> 0;
  return h;
}

function initAllStrips() {
  $$('.filmstrip').forEach(strip => {
    if (strip.dataset.arrowInit) return;
    strip.dataset.arrowInit = '1';
    const track = strip.querySelector('.film-track');
    const left = strip.querySelector('.film-arrow-left');
    const right = strip.querySelector('.film-arrow-right');
    if (!track) return;
    const updateArrows = () => {
      const maxScroll = track.scrollWidth - track.clientWidth;
      if (left) left.disabled = track.scrollLeft <= 1;
      if (right) right.disabled = track.scrollLeft >= maxScroll - 1;
    };
    track.addEventListener('scroll', updateArrows, { passive: true });
    setTimeout(updateArrows, 50);

    let holdTimer = null, holdInterval = null;
    const startHold = (dir) => {
      holdTimer = setTimeout(() => {
        holdInterval = setInterval(() => {
          track.scrollLeft += dir * 6;
        }, 60);
      }, 300);
    };
    const stopHold = () => {
      clearTimeout(holdTimer);
      clearInterval(holdInterval);
      holdTimer = null; holdInterval = null;
    };
    const clickMove = (dir) => {
      const maxScroll = track.scrollWidth - track.clientWidth;
      const target = Math.max(0, Math.min(maxScroll, track.scrollLeft + dir * 160));
      track.scrollTo({ left: target, behavior: 'smooth' });
    };
    if (left) {
      left.addEventListener('pointerdown', e => { e.stopPropagation(); startHold(-1); });
      left.addEventListener('pointerup', e => { e.stopPropagation(); stopHold(); });
      left.addEventListener('pointerleave', stopHold);
      left.addEventListener('click', e => {
        e.stopPropagation();
        if (e.detail === 1 && !holdInterval) clickMove(-1);
      });
    }
    if (right) {
      right.addEventListener('pointerdown', e => { e.stopPropagation(); startHold(1); });
      right.addEventListener('pointerup', e => { e.stopPropagation(); stopHold(); });
      right.addEventListener('pointerleave', stopHold);
      right.addEventListener('click', e => {
        e.stopPropagation();
        if (e.detail === 1 && !holdInterval) clickMove(1);
      });
    }

    let down = false, startX = 0, startScroll = 0, dragged = false;
    track.addEventListener('pointerdown', e => { down = true; dragged = false; startX = e.clientX; startScroll = track.scrollLeft; track.setPointerCapture(e.pointerId); });
    track.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 5) { dragged = true; track.classList.add('dragging'); }
      if (dragged) track.scrollLeft = startScroll - dx;
    });
    const end = () => { down = false; track.classList.remove('dragging'); setTimeout(() => { dragged = false; }, 30); };
    track.addEventListener('pointerup', end);
    track.addEventListener('pointercancel', end);
    track.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
  });
}

  const retention = state.settings.trashRetentionDays || 30;
