async function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function ensureMobileNet() {
  if (mobilenetModel) return mobilenetModel;
  if (mobilenetLoadPromise) return mobilenetLoadPromise;
  mobilenetLoadPromise = (async () => {
    try {
      if (!window.tf) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
      if (!window.mobilenet) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
      mobilenetModel = await window.mobilenet.load({ version: 2, alpha: 0.5 });
      return mobilenetModel;
    } catch (e) { console.warn('MobileNet 加载失败', e); return null; }
  })();
  return mobilenetLoadPromise;
}

async function ensureTransformers() {
  if (transformersPipeline) return transformersPipeline;
  if (transformersLoadPromise) return transformersLoadPromise;
  transformersLoadPromise = (async () => {
    try {
      if (!window.transformers) {
        await loadScript('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0');
      }
      const t = window.transformers;
      if (!t || !t.pipeline) throw new Error('transformers 不可用');
      transformersPipeline = await t.pipeline('image-classification', 'Xenova/vit-base-patch16-224', { dtype: 'q8' });
      return transformersPipeline;
    } catch (e) { console.warn('Transformers.js 加载失败', e); return null; }
  })();
  return transformersLoadPromise;
}

async function ensureExifr() {
  if (exifrLib) return exifrLib;
  if (exifrLoadPromise) return exifrLoadPromise;
  exifrLoadPromise = (async () => {
    try {
      if (!window.exifr) {
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('exifr load timeout')), 2000));
        await Promise.race([loadScript('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js'), timeout]);
      }
      exifrLib = window.exifr;
      return exifrLib;
    } catch (e) { console.warn('exifr 加载失败', e); return null; }
  })();
  return exifrLoadPromise;
}
function formatShutter(t) {
  if (!t || t <= 0) return '';
  return t >= 1 ? `${t}s` : `1/${Math.round(1/t)}s`;
}
function formatAperture(f) { return f ? `f/${Number(f).toFixed(1)}` : ''; }
function formatFocal(f) { return f ? `${Math.round(f)}mm` : ''; }
function formatISO(i) { return i ? `ISO ${i}` : ''; }
function formatCamera(make, model) {
  const m = (make || '').trim();
  const mo = (model || '').trim();
  if (!mo) return m;
  if (m && mo.toLowerCase().startsWith(m.toLowerCase())) return mo;
  return m ? `${m} ${mo}` : mo;
}
function readExifSafe(file) {
  const work = ensureExifr().then(exifr => {
    if (!exifr) return null;
    return exifr.parse(file, { pick: ['Make', 'Model', 'LensModel', 'ISO', 'FNumber', 'ExposureTime', 'FocalLength', 'DateTimeOriginal'] }).then(data => {
      if (!data) return null;
      return {
        camera: formatCamera(data.Make, data.Model),
        lens: data.LensModel || '',
        iso: formatISO(data.ISO),
        aperture: formatAperture(data.FNumber),
        shutter: formatShutter(data.ExposureTime),
        focal: formatFocal(data.FocalLength)
      };
    }).catch(() => null);
  }).catch(() => null);
  return Promise.race([
    work,
    new Promise(res => setTimeout(() => res(null), 1500))
  ]);
}

const SCENE_MAP = {
  portrait: ['person', 'face', 'man', 'woman', 'child', 'groom', 'bride', 'suit', 'jersey', 'wig'],
  landscape: ['seashore', 'lakeside', 'mountain', 'valley', 'volcano', 'geyser', 'promontory', 'sandbar', 'cliff', 'coral reef', 'alp', 'fountain'],
  sport: ['racket', 'ball', 'basketball', 'soccer', 'volleyball', 'ski', 'bicycle', 'horse'],
  food: ['pizza', 'sushi', 'espresso', 'plate', 'dish', 'burrito', 'cheeseburger', 'hotdog', 'pretzel', 'bagel', 'guacamole', 'carbonara', 'ice cream', 'trifle', 'custard', 'wine bottle'],
  festival: ['balloon', 'christmas', 'candle', 'jack-o-lantern', 'corn'],
  building: ['castle', 'church', 'monastery', 'palace', 'skyscraper', 'bridge', 'lighthouse', 'dome', 'barn', 'boathouse', 'library', 'mosque', 'planetarium', 'prison', 'stupa', 'triumphal arch'],
  animal: ['dog', 'cat', 'bird', 'fish', 'horse', 'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe', 'penguin', 'snake', 'lizard', 'frog', 'insect', 'butterfly', 'retriever', 'terrier', 'husky', 'tabby', 'siamese', 'parrot', 'goldfish'],
  night: ['street sign', 'traffic light', 'spotlight', 'firework', 'candle'],
  still: ['vase', 'book', 'clock', 'teapot', 'coffee mug', 'flowerpot', 'candle', 'lamp', 'quill', 'typewriter', 'basket'],
  street: ['street sign', 'traffic light', 'manhole', 'crosswalk', 'barber', 'newsstand']
};
function mapImageNetToScene(className) {
  const c = className.toLowerCase();
  for (const [scene, keys] of Object.entries(SCENE_MAP)) {
    for (const k of keys) if (c.includes(k)) return scene;
  }
  return null;
}

function heuristicAnalyze(blob) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      try {
        URL.revokeObjectURL(url);
        const size = 64;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        let rSum = 0, gSum = 0, bSum = 0, satSum = 0, brightSum = 0, brightPts = 0;
        const total = size * size;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          rSum += r; gSum += g; bSum += b;
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          satSum += max === 0 ? 0 : (max - min) / max;
          const br = (r + g + b) / 3;
          brightSum += br;
          if (br > 220) brightPts++;
        }
        const avgR = rSum / total, avgB = bSum / total;
        const avgSat = satSum / total, avgBright = brightSum / total;
        const ratio = (img.naturalWidth || 1) / (img.naturalHeight || 1);
        const tags = [];
        if (avgSat < 0.08) tags.push('黑白');
        else if (avgR - avgB > 22) tags.push('暖调');
        else if (avgB - avgR > 22) tags.push('冷调');
        if (avgBright > 180) tags.push('高调');
        else if (avgBright < 55) tags.push('低调');
        if (ratio > 1.3) tags.push('横构图');
        else if (ratio < 0.77) tags.push('竖构图');
        else tags.push('方构图');
        const candidates = [];
        if (avgBright < 55 && brightPts / total > 0.08) candidates.push({ scene: 'night', conf: 0.5, hint: '推测' });
        if (avgR - avgB > 30 && avgSat > 0.4) candidates.push({ scene: 'festival', conf: 0.4, hint: '推测' });
        resolve({ colorTags: tags, candidates, ratio });
      } catch (e) { resolve({ colorTags: [], candidates: [], ratio: 1 }); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve({ colorTags: [], candidates: [], ratio: 1 }); };
    img.src = url;
  });
}

async function analyzeWithLocal(blob) {
  const pipe = await ensureTransformers();
  if (!pipe) return null;
  const url = URL.createObjectURL(blob);
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000));
    const result = await Promise.race([pipe(url, { topk: 5 }), timeout]);
    const candidates = [];
    const descCandidates = [];
    (result || []).forEach(r => {
      const sc = mapImageNetToScene(r.label);
      if (sc && !candidates.find(c => c.scene === sc)) candidates.push({ scene: sc, conf: r.score, hint: '' });
      const desc = r.label.split(',')[0].trim();
      if (desc && desc.length < 14 && !descCandidates.includes(desc)) descCandidates.push(desc);
    });
    return { candidates: candidates.slice(0, 3), descCandidates: descCandidates.slice(0, 3) };
  } catch (e) {
    console.warn('本地识别失败', e);
    return null;
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function analyzeWithCloud(blob) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    const res = await fetch('https://api-inference.huggingface.co/models/google/vit-base-patch16-224', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: blob,
      signal: controller.signal
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error('cloud http ' + res.status);
    const data = await res.json();
    const arr = Array.isArray(data) ? data : (data[0] ? data : []);
    const candidates = [];
    const descCandidates = [];
    arr.forEach(r => {
      const sc = mapImageNetToScene(r.label || '');
      if (sc && !candidates.find(c => c.scene === sc)) candidates.push({ scene: sc, conf: r.score || 0.5, hint: '' });
      const desc = String(r.label || '').split(',')[0].trim();
      if (desc && desc.length < 14 && !descCandidates.includes(desc)) descCandidates.push(desc);
    });
    return { candidates: candidates.slice(0, 3), descCandidates: descCandidates.slice(0, 3) };
  } catch (e) {
    console.warn('云端识别失败', e);
    return null;
  }
}

async function analyzeImage(blob, opts = {}) {
  const heur = await heuristicAnalyze(blob);
  let candidates = [...heur.candidates];
  let descCandidates = [];
  let source = 'basic';
  if (opts.useLocal) {
    const local = await analyzeWithLocal(blob);
    if (local) {
      source = 'local';
      local.candidates.forEach(c => { if (!candidates.find(x => x.scene === c.scene)) candidates.push(c); });
      local.descCandidates.forEach(d => { if (!descCandidates.includes(d)) descCandidates.push(d); });
    } else if (opts.useCloud) {
      const cloud = await analyzeWithCloud(blob);
      if (cloud) {
        source = 'cloud';
        cloud.candidates.forEach(c => { if (!candidates.find(x => x.scene === c.scene)) candidates.push(c); });
        cloud.descCandidates.forEach(d => { if (!descCandidates.includes(d)) descCandidates.push(d); });
      }
    }
  } else if (opts.useCloud) {
    const cloud = await analyzeWithCloud(blob);
    if (cloud) {
      source = 'cloud';
      cloud.candidates.forEach(c => { if (!candidates.find(x => x.scene === c.scene)) candidates.push(c); });
      cloud.descCandidates.forEach(d => { if (!descCandidates.includes(d)) descCandidates.push(d); });
    }
  }
  candidates.sort((a, b) => b.conf - a.conf);
  const aiFailed = (opts.useLocal || opts.useCloud) && source === 'basic';
  return { colorTags: heur.colorTags, candidates: candidates.slice(0, 3), descCandidates: descCandidates.slice(0, 3), ratio: heur.ratio, source, aiFailed };
}

async function checkVideo(file) {
  if (file.size > 50 * 1024 * 1024) return { ok: false, msg: '视频超过 50MB，请先压缩后再上传' };
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => {
      URL.revokeObjectURL(v.src);
      if (v.duration > 60) resolve({ ok: false, msg: '视频超过 60 秒，请选择更短的片段' });
      else resolve({ ok: true });
    };
    v.onerror = () => { URL.revokeObjectURL(v.src); resolve({ ok: false, msg: '视频读取失败' }); };
    v.src = URL.createObjectURL(file);
  });
}
async function extractVideoCover(file) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.preload = 'auto'; v.muted = true;
    v.onloadeddata = () => {
      const canvas = document.createElement('canvas');
      canvas.width = v.videoWidth || 640; canvas.height = v.videoHeight || 360;
      canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(v.src);
      canvas.toBlob(b => resolve(b), 'image/jpeg', 0.85);
    };
    v.onerror = () => { URL.revokeObjectURL(v.src); resolve(null); };
    v.src = URL.createObjectURL(file);
  });
}

async function compressImage(file, maxSide = 1920) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        URL.revokeObjectURL(url);
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (!w || !h) return reject(new Error('图片尺寸无效'));
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => { blob ? resolve({ blob, w, h }) : reject(new Error('压缩失败')); }, 'image/jpeg', 0.86);
      } catch (err) { reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片加载失败')); };
    img.src = url;
  });
}

const RT = { photo: null, img: null, cropRatio: 'free', rotate: 0, flipH: false, flipV: false, filter: 'original', brightness: 0, contrast: 0, saturation: 0 };

function openRetouchEditor(p) {
  if (!p || p.kind === 'live') { toast('视频暂不支持修图'); return; }
  if (!p.blob) { toast('外链照片不支持修图，请先重新上传'); return; }
  RT.photo = p;
  RT.cropRatio = 'free'; RT.rotate = 0; RT.flipH = false; RT.flipV = false;
  RT.filter = 'original'; RT.brightness = 0; RT.contrast = 0; RT.saturation = 0;
  const src = photoSrc(p);
  const img = new Image();
  img.onload = () => {
    RT.img = img;
    RT.sx = 0; RT.sy = 0; RT.sw = img.naturalWidth; RT.sh = img.naturalHeight;
    $('#edCanvas').width = img.naturalWidth;
    $('#edCanvas').height = img.naturalHeight;
    $$('#edFilterRow .editor-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'original'));
    $$('#edCropRow .editor-btn').forEach(b => b.classList.toggle('active', b.dataset.crop === 'free'));
    $('#edBrightness').value = 0; $('#edContrast').value = 0; $('#edSaturation').value = 0;
    $('#edBrightnessVal').textContent = 0; $('#edContrastVal').textContent = 0; $('#edSaturationVal').textContent = 0;
    $('#edRestoreSection').style.display = p.originalBlob ? 'block' : 'none';
    renderEditorPreview();
    $('#editor').classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  img.onerror = () => toast('图片加载失败');
  img.src = src;
}

function renderEditorPreview() {
  const img = RT.img; if (!img) return;
  const canvas = $('#edCanvas');
  const ctx = canvas.getContext('2d');
  const { sx, sy, sw, sh, rotate, flipH, flipV, filter, brightness, contrast, saturation } = RT;
  const rotated = (rotate === 90 || rotate === 270);
  canvas.width = rotated ? sh : sw;
  canvas.height = rotated ? sw : sh;
  let filterStr = '';
  if (filter === 'warm') filterStr = 'sepia(0.35) saturate(1.2) contrast(1.05) brightness(1.04) hue-rotate(-6deg)';
  else if (filter === 'bw') filterStr = 'grayscale(1) contrast(1.14) brightness(1.02)';
  else if (filter === 'fade') filterStr = 'saturate(0.62) contrast(0.88) brightness(1.08) sepia(0.14)';
  filterStr += ` brightness(${1 + brightness / 100}) contrast(${1 + contrast / 100}) saturate(${1 + saturation / 100})`;
  ctx.filter = filterStr;
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rotate * Math.PI / 180);
  ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
  ctx.drawImage(img, sx, sy, sw, sh, -sw / 2, -sh / 2, sw, sh);
  ctx.restore();
}

function applyCropRatio(ratio) {
  RT.cropRatio = ratio;
  const img = RT.img; if (!img) return;
  const W = img.naturalWidth, H = img.naturalHeight;
  let w, h;
  if (ratio === 'free') { w = W; h = H; }
  else {
    const [rw, rh] = ratio.split(':').map(Number);
    const target = rw / rh;
    const cur = W / H;
    if (cur > target) { h = H; w = H * target; }
    else { w = W; h = W / target; }
  }
  RT.sx = (W - w) / 2; RT.sy = (H - h) / 2; RT.sw = w; RT.sh = h;
  renderEditorPreview();
}

function closeEditor() {
  $('#editor').classList.remove('open');
  document.body.style.overflow = lbEl.classList.contains('open') ? 'hidden' : '';
  RT.photo = null; RT.img = null;
}

async function exportBackup() {
  const exported = [];
  for (const p of state.photos) {
    const o = { ...p };
    if (p.blob) { o.blobData = await blobToDataURL(p.blob); delete o.blob; }
    if (p.originalBlob) { o.originalBlobData = await blobToDataURL(p.originalBlob); delete o.originalBlob; }
    if (p.videoBlob) { o.videoBlobData = await blobToDataURL(p.videoBlob); delete o.videoBlob; }
    if (p.coverBlob) { o.coverBlobData = await blobToDataURL(p.coverBlob); delete o.coverBlob; }
    exported.push(o);
  }
  const payload = {
    app: 'darkroom-gallery', version: 2, exportedAt: new Date().toISOString(),
    albums: state.albums, sceneTypes: state.sceneTypes,
    homeSort: state.settings.homeSort, trashRetentionDays: state.settings.trashRetentionDays,
    photos: exported
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `darkroom-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('备份已导出');
}
function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataUrl) {
  const [head, body] = dataUrl.split(',');
  const mime = (head.match(/:(.*?);/) || [, 'image/jpeg'])[1];
  const bin = atob(body);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function importBackup(file) {
  const text = await file.text();
  const data = JSON.parse(text);
  if (!data || !Array.isArray(data.photos)) throw new Error('bad format');
  let count = 0;
  for (const a of (data.albums || [])) await idbPut('albums', a);
  if (Array.isArray(data.sceneTypes) && data.sceneTypes.length >= 2) state.sceneTypes = data.sceneTypes;
  else state.sceneTypes = [...DEFAULT_SCENES];
  await idbPut('settings', { key: 'sceneTypes', value: state.sceneTypes });
  if (data.homeSort) { state.settings.homeSort = data.homeSort; await idbPut('settings', { key: 'homeSort', value: data.homeSort }); }
  if (data.trashRetentionDays) { state.settings.trashRetentionDays = data.trashRetentionDays; await idbPut('settings', { key: 'trashRetentionDays', value: data.trashRetentionDays }); }
  for (const p of data.photos) {
    const o = { ...p };
    if (o.blobData) { o.blob = dataURLToBlob(o.blobData); delete o.blobData; }
    if (o.originalBlobData) { o.originalBlob = dataURLToBlob(o.originalBlobData); delete o.originalBlobData; }
    if (o.videoBlobData) { o.videoBlob = dataURLToBlob(o.videoBlobData); delete o.videoBlobData; }
    if (o.coverBlobData) { o.coverBlob = dataURLToBlob(o.coverBlobData); delete o.coverBlobData; }
    if (o.deletedAt === undefined) o.deletedAt = null;
    if (o.restoredAt === undefined) o.restoredAt = null;
    if (o.scene === undefined) o.scene = null;
    if (o.kind !== 'photo' && o.kind !== 'polaroid' && o.kind !== 'live' && o.kind !== 'film') o.kind = 'photo';
    await idbPut('photos', o); count++;
  }
  state.photos = await idbAll('photos');
  state.albums = await idbAll('albums');
  await idbPut('settings', { key: 'seeded', value: true });
  toast(`已导入 ${count} 张照片`);
  refreshCurrentView();
}

/* =========================================================
   26. 启动与长按交互
   ========================================================= */
let haloEl = null;
let pressTimer = null;
let isLongPress = false;
let activeBtn = null;
let startBtn = null;
let startX = 0;
let startY = 0;
let currentTargetBtn = null;

function initLongPressHalo() {
  if (!haloEl) {
    haloEl = document.createElement('div');
    haloEl.className = 'long-press-halo';
    document.body.appendChild(haloEl);
    
    document.addEventListener('dragstart', e => {
      if (isLongPress) e.preventDefault();
    }, { capture: true });
    
    document.addEventListener('contextmenu', e => {
      if (isLongPress) e.preventDefault();
    });
    
    document.addEventListener('click', e => {
      if (isLongPress || ignoreNextClick) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, { capture: true });
  }

  const toolbars = [document.querySelector('.lb-tools'), document.querySelector('.lb-mobile-tools')];
  
  toolbars.forEach(toolbar => {
    if (!toolbar) return;
    toolbar.style.touchAction = 'none';
    toolbar.style.userSelect = 'none';
    toolbar.style.webkitUserSelect = 'none';

    toolbar.addEventListener('pointerdown', e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      const btn = e.target.closest('button');
      if (!btn || btn.disabled) return;

      isLongPress = false;
      startBtn = btn;
      activeBtn = btn;
      currentTargetBtn = btn;
      startX = e.clientX;
      startY = e.clientY;

      pressTimer = setTimeout(() => {
        isLongPress = true;
        document.body.style.userSelect = 'none';
        
        const rect = btn.getBoundingClientRect();
        haloEl.style.width = `44px`;
        haloEl.style.height = `44px`;
        haloEl.style.left = `${rect.left + rect.width / 2}px`;
        haloEl.style.top = `${rect.top + rect.height / 2}px`;
        haloEl.style.borderRadius = '50%';
        haloEl.style.transform = `translate(-50%, -50%) scale(1)`;
        
        haloEl.classList.add('active');
        haloEl.classList.remove('dragging');
        if (navigator.vibrate) navigator.vibrate(20);
      }, 300);
    });

    toolbar.addEventListener('pointermove', e => {
      if (!isLongPress) {
        if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
          clearTimeout(pressTimer);
        }
        return;
      }
      e.preventDefault();
      
      haloEl.classList.add('dragging');
      haloEl.style.left = `${e.clientX}px`;
      haloEl.style.top = `${e.clientY}px`;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      
      if (currentTargetBtn === startBtn && distance > 20) {
        const scaleX = 1 + Math.abs(dx) * 0.005;
        const scaleY = 1 + Math.abs(dy) * 0.005;
        haloEl.style.transform = `translate(-50%, -50%) scaleX(${scaleX}) scaleY(${scaleY})`;
        haloEl.style.borderRadius = '40%';
      }

      let targetBtn = null;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const elBtn = target?.closest('button');

      if (elBtn && toolbar.contains(elBtn) && !elBtn.disabled) {
        targetBtn = elBtn;
      } else {
        const buttons = Array.from(toolbar.querySelectorAll('button')).filter(b => !b.disabled);
        if (buttons.length > 0) {
          let minDist = Infinity;
          let nearest = null;
          buttons.forEach(b => {
            const rect = b.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
            if (dist < minDist) { minDist = dist; nearest = b; }
          });
          if (minDist < 150) targetBtn = nearest;
        }
      }

      if (targetBtn) {
        if (currentTargetBtn !== targetBtn) {
          currentTargetBtn = targetBtn;
          activeBtn = targetBtn;
          
          haloEl.classList.remove('dragging');
          haloEl.style.width = `44px`;
          haloEl.style.height = `44px`;
          haloEl.style.borderRadius = '50%';
          haloEl.style.transform = `translate(-50%, -50%) scale(1)`;
          
          const rect = targetBtn.getBoundingClientRect();
          haloEl.style.left = `${rect.left + rect.width / 2}px`;
          haloEl.style.top = `${rect.top + rect.height / 2}px`;
          if (navigator.vibrate) navigator.vibrate(15);
        }
      } else {
        currentTargetBtn = null;
        activeBtn = null;
      }
    });

    toolbar.addEventListener('pointerup', e => {
      clearTimeout(pressTimer);
      if (isLongPress) {
        e.preventDefault();
        e.stopPropagation();
        isLongPress = false;
        document.body.style.userSelect = '';
        haloEl.classList.remove('active', 'dragging');
        if (activeBtn) {
          setTimeout(() => { activeBtn.click(); }, 10);
        }
      }
      activeBtn = null;
      currentTargetBtn = null;
    });

    toolbar.addEventListener('pointercancel', cancelLongPress);
  });
}

async function boot() {
  try {
    await openDB();
    state.photos = await idbAll('photos');
    state.albums = await idbAll('albums');
    const seeded = await idbGet('settings', 'seeded');
    if (!seeded) {
      const ct = await idbGet('settings', 'sceneTypes');
      state.sceneTypes = ct && Array.isArray(ct.value) && ct.value.length >= 2 ? ct.value : [...DEFAULT_SCENES];
      if (!ct) await idbPut('settings', { key: 'sceneTypes', value: state.sceneTypes });
      await seedData();
      await idbPut('settings', { key: 'seeded', value: true });
      state.photos = await idbAll('photos');
      state.albums = await idbAll('albums');
    } else {
      const ct = await idbGet('settings', 'sceneTypes');
      state.sceneTypes = ct && Array.isArray(ct.value) && ct.value.length >= 2 ? ct.value : [...DEFAULT_SCENES];
      if (!ct) await idbPut('settings', { key: 'sceneTypes', value: state.sceneTypes });
    }
    const simSetting = await idbGet('settings', 'filmSim');
    if (simSetting) { LB.filmSim = simSetting.value; state.settings.filmSim = simSetting.value; }
    const hs = await idbGet('settings', 'homeSort');
    if (hs) state.settings.homeSort = hs.value;
    const tr = await idbGet('settings', 'trashRetentionDays');
    if (tr) state.settings.trashRetentionDays = tr.value;
    let migrated = false;
    for (const p of state.photos) {
      if (p.id.startsWith('seed-') && p.scene === undefined) {
        const seed = SEED_PHOTOS.find(s => 'seed-' + s.s === p.id);
        if (seed) { p.scene = seed.scene || null; p.updatedAt = Date.now(); await idbPut('photos', p); migrated = true; }
      }
      if (p.deletedAt === undefined) { p.deletedAt = null; migrated = true; }
      if (p.restoredAt === undefined) { p.restoredAt = null; migrated = true; }
      if (p.kind && p.kind !== 'photo' && p.kind !== 'polaroid' && p.kind !== 'live' && p.kind !== 'film') { p.kind = 'photo'; migrated = true; }
    }
    if (migrated) state.photos = await idbAll('photos');
    await cleanupExpiredTrash();
  } catch (err) {
    console.error('初始化失败', err);
    toast('本地存储初始化失败，可能处于隐私模式');
  }
  
  initLongPressHalo();
  route();
  
  const { params } = parseHash();
  const photoId = params.get('photo');
  if (photoId) {
    const list = visiblePhotos().map(p => p.id);
    const idx = list.indexOf(photoId);
    if (idx >= 0) setTimeout(() => openLightbox(list, idx), 400);
  }
}
boot();
</script>
